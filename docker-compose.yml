services:
  postgres:
    image: postgres:latest
    container_name: learningbff-postgres
    environment:
      POSTGRES_DB: LearningBFF
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LearningBFF"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    command: ["--migrate-database"]
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=LearningBFF;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=LearningBFF;Username=postgres;Password=postgres"
      App__SelfUrl: http://localhost:8080
      App__HealthCheckUrl: /health-status
      AuthServer__Authority: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    restart: unless-stopped

